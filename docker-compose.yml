services:
  server:
    build:
      context: .
      dockerfile: src/server/Dockerfile

    ports:
      - "3000:3000"

    # Mount server and shared source code so changes are reflected without rebuilding the image
    volumes:
      - ./src/server:/app/server
      - ./src/shared:/app/shared
      - server_node_modules:/app/server/node_modules

    working_dir: /app/server

volumes:
  server_node_modules: